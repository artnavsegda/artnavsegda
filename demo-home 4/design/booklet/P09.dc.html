<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Бесшовная интеграция</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;family=Geologica:wght@200;300;400;500&amp;family=Onest:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
img{box-sizing:border-box}
a{color:#C9944F}a:hover{color:#E0B176}
</style>
</helmet>
<div style="width: 794px; height: 1123px; position: relative; overflow: hidden; box-sizing: border-box; padding: 68px 72px 0; background: #121211; color: #EDEBE6; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <span style="font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #C9944F">Глава II</span>
  <h1 style="margin: 0; font: 200 52px/1.04 'Geologica', sans-serif; letter-spacing: -0.03em; text-wrap: balance">Бесшовно — значит, без компромиссов для архитектора</h1>
  <p style="margin: 0; max-width: 580px; font-size: 16px; line-height: 1.6; color: #CFCBC3; text-wrap: pretty">Мы приходим в проект на стадии эскиза, а не после отделки. Поэтому в готовом доме видно только то, что задумано: ни лишней коробки на стене, ни случайной панели в главном ракурсе.</p>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
    <img src="/_blob/0af4950047accee169829ae209ee1556" alt="План этажа в тренде «Минимализм»: чертёж с мебелью, свет показан штриховкой" style="display: block; width: 100%; height: 330px; object-fit: cover; object-position: 50% 40%; border-radius: 10px; border: 6px solid #050505">
    <figcaption style="font-size: 12px; letter-spacing: .04em; color: #A8A49C">План в интерфейсе строится из рабочих чертежей: стены, проёмы, мебель — как у архитектора.</figcaption>
  </figure>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 30px 1fr; gap: 4px 12px; padding: 14px 0; border-top: 1px solid #3A3936">
        <span style="grid-row: span 2; font: 200 26px/1 'Geologica', sans-serif; color: #C9944F">{{s.n}}</span>
        <b style="font: 400 16px/1.3 'Geologica', sans-serif">{{s.t}}</b>
        <span style="font-size: 13.5px; line-height: 1.55; color: #A8A49C">{{s.d}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 72px; right: 72px; bottom: 40px; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8C887F">
    <span>Анфилада · Свод</span><span>09</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stages: [
        { n: '1', t: 'Эскиз', d: 'Сценарии жизни семьи, зоны управления, места панелей вне главных ракурсов.' },
        { n: '2', t: 'Рабочий проект', d: 'Ниши под панели заподлицо, скрытые датчики присутствия, щиты и трассы в чертежах.' },
        { n: '3', t: 'Выключатели и рамки', d: 'Клавиши из коллекции интерьера: латунь, камень, стекло. Рамки панелей в цвет стены.' },
        { n: '4', t: 'Интерфейс', d: 'Фото с рендеров, план из чертежей, палитра и шрифты дизайнера — экран продолжает комнату.' }
      ]
    };
  }
}
</script>
</body>
</html>
